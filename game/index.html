<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>材料研究</title>
<meta name="description" content="材料研究系列 · 可配置的 WebGPU 交互作品模板。">
<style id="theme-vars"></style>
<style>
:root{
  --bg:#ece6dc; --ink:#1d1a16; --ink2:#5d554b; --ink3:#8b8276;
  --glass:rgba(250,247,241,.62); --glass-b:rgba(29,26,22,.10);
  --accent:#c2562b; --accent2:#2a8c86; --track:rgba(29,26,22,.14);
  --pill:rgba(250,247,241,.75); --shadow:0 18px 50px -20px rgba(60,40,20,.35);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
body.dark{
  --bg:#0f1424; --ink:#efe7da; --ink2:#b9b0a3; --ink3:#857d72;
  --glass:rgba(20,24,40,.58); --glass-b:rgba(239,231,218,.12);
  --accent:#f0a050; --accent2:#5fd0c4; --track:rgba(239,231,218,.18);
  --pill:rgba(20,24,40,.7); --shadow:0 18px 50px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;transition:background-color .8s,color .8s}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas#gl.grabbing{cursor:grabbing}
canvas#gl.pointer{cursor:pointer}
.ui{position:fixed;z-index:2;pointer-events:none}
.ui *{pointer-events:auto}
#masthead{left:28px;top:24px;max-width:340px;pointer-events:none}
#masthead *{pointer-events:none}
.eyebrow{font:600 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);display:flex;gap:10px;align-items:center}
.eyebrow i{display:inline-block;width:22px;height:1px;background:currentColor;opacity:.6}
h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:64px;line-height:.9;letter-spacing:-.02em;margin:14px 0 14px}
h1 span{display:block}
h1 em{font-style:italic;color:var(--accent)}
.lede{font-family:var(--serif);font-size:15px;line-height:1.45;color:var(--ink2);margin:0;max-width:300px}
#status{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 11px 6px 9px;border-radius:99px;background:var(--pill);
  border:1px solid var(--glass-b);font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none}
#status b{width:7px;height:7px;border-radius:50%;background:#9a9186}
#status.live b{background:#3bb273;box-shadow:0 0 0 3px rgba(59,178,115,.18);animation:pulse 2.4s infinite}
#status.paused b{background:#e0a33a}
#status.na b{background:#d0473a}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(59,178,115,0)}}

#panel{right:20px;top:20px;width:272px;max-height:calc(100% - 40px);overflow:auto;padding:18px 18px 16px;border-radius:18px;
  background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);transition:background .8s,border-color .8s}
#panel::-webkit-scrollbar{width:0}
.handle{display:none}
.sec{padding:2px 0 14px;margin-bottom:12px;border-bottom:1px solid var(--glass-b)}
.sec:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.sec h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 small{font:600 9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);font-style:normal}
.row{display:flex;gap:6px}
button{font:600 11.5px/1 var(--sans);letter-spacing:.02em;color:var(--ink);background:transparent;border:1px solid var(--track);
  border-radius:10px;padding:9px 8px;cursor:pointer;flex:1;transition:background .15s,border-color .15s,transform .08s;white-space:nowrap}
button:hover{background:var(--track)}
button:active{transform:translateY(1px)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.primary:hover{opacity:.88;background:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meter{margin:12px 0 8px}
.meter .lbl{display:flex;justify-content:space-between;font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.bar{height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .15s}
.counts{display:flex;justify-content:space-between;font:500 11px/1.2 var(--mono);color:var(--ink2);margin-top:10px}
.counts b{display:block;font:400 22px/1 var(--serif);font-style:italic;color:var(--ink);margin-bottom:3px}
.counts div{flex:1}
.counts div+div{border-left:1px solid var(--glass-b);padding-left:10px}
.flav{display:flex;gap:6px}
.flav button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px 8px}
.flav button i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 -4px 8px rgba(0,0,0,.25),inset 0 3px 6px rgba(255,255,255,.5)}
.flav button[aria-pressed=true]{border-color:var(--ink);background:var(--track)}
.slider{margin-top:12px}
.slider .lbl{display:flex;justify-content:space-between;font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.slider .lbl output{color:var(--ink2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--track)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);margin-top:-6px;border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
#howto{left:28px;bottom:22px;max-width:520px;pointer-events:none}
#howto *{pointer-events:none}
#howto .line{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink)}
#howto .line kbd{font:600 10px/1 var(--mono);font-style:normal;border:1px solid var(--track);border-radius:5px;padding:2px 5px;margin:0 2px;color:var(--ink2);vertical-align:2px}
#howto p{margin:5px 0 0;font:500 11px/1.55 var(--mono);color:var(--ink3);letter-spacing:.01em}
#fallback{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#fallback .card{max-width:440px;padding:32px 30px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow)}
#fallback h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:38px;margin:12px 0 10px;line-height:1}
#fallback p{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink2);margin:0 0 10px}
#fallback code{font:500 12px var(--mono);background:var(--track);padding:2px 5px;border-radius:4px}
body.na #fallback{display:flex}
body.na #panel,body.na #howto{display:none}
@media (max-width:760px){
  #dpad{bottom:150px;left:16px}
  #masthead{left:18px;top:16px;max-width:70%}
  h1{font-size:42px;margin:10px 0 8px}
  .lede{display:none}
  #status{margin-top:8px}
  #howto{display:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:62vh;border-radius:18px 18px 0 0;padding:6px 18px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(calc(100% - 134px));transition:transform .35s cubic-bezier(.2,.8,.2,1),background .8s}
  #panel.open{transform:none}
  .handle{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 10px;cursor:pointer;border:0;width:100%;background:none}
  .handle i{width:40px;height:4px;border-radius:4px;background:var(--track)}
  .handle span{font:600 9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

.ui-btn{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 8px;padding:6px 11px;border-radius:99px;background:var(--pill);border:1px solid var(--glass-b);
  font:600 10.5px/1 var(--mono);letter-spacing:.12em;color:var(--ink2);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:auto;flex:none;width:auto}
.ui-btn:hover{color:var(--ink);background:var(--pill)}
#masthead .tools{display:flex;align-items:center;flex-wrap:wrap}
#masthead .tools *{pointer-events:auto}
#masthead #status{margin-top:10px}
/* ── config editor ── */
#editor{position:fixed;z-index:4;left:0;top:0;bottom:0;width:400px;max-width:100%;display:flex;flex-direction:column;
  background:var(--glass);border-right:1px solid var(--glass-b);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .8s;color:var(--ink)}
#editor.open{transform:none}
#editor header{padding:18px 18px 10px;border-bottom:1px solid var(--glass-b)}
#editor header h2{font:400 26px/1 var(--serif);font-style:italic;margin:8px 0 6px;display:flex;justify-content:space-between;align-items:center}
#editor header p{margin:0;font:500 11px/1.5 var(--mono);color:var(--ink3)}
#editor .edbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;border-bottom:1px solid var(--glass-b)}
#editor .edbar button{flex:1 1 auto;padding:7px 8px;font-size:11px}
#editor .tabs{display:flex;gap:4px;padding:8px 18px 0}
#editor .tabs button{flex:none;border-radius:8px 8px 0 0;border-bottom:0;padding:7px 12px;font-size:11px}
#editor .tabs button[aria-selected=true]{background:var(--track);border-color:var(--track)}
#editor .body{flex:1;overflow:auto;padding:6px 18px 30px}
#editor .body::-webkit-scrollbar{width:6px}#editor .body::-webkit-scrollbar-thumb{background:var(--track);border-radius:6px}
#editor details{border-bottom:1px solid var(--glass-b);padding:2px 0}
#editor details details{border:0;border-left:1px solid var(--glass-b);margin-left:2px;padding-left:10px}
#editor summary{cursor:pointer;list-style:none;padding:9px 0 7px;font:600 11px/1.2 var(--mono);letter-spacing:.08em;color:var(--ink2);display:flex;align-items:center;gap:8px}
#editor summary::-webkit-details-marker{display:none}
#editor summary::before{content:'▸';font-size:9px;color:var(--ink3);transition:transform .15s}
#editor details[open]>summary::before{transform:rotate(90deg)}
#editor summary small{color:var(--ink3);font-weight:500;letter-spacing:0}
#editor summary .rm{margin-left:auto;flex:none;padding:2px 7px;border-radius:6px;font-size:11px}
#editor .f{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:8px;padding:4px 0}
#editor .f>label{font:500 11px/1.25 var(--mono);color:var(--ink3);overflow:hidden;text-overflow:ellipsis}
#editor .f.wide{grid-template-columns:1fr}
#editor input[type=text],#editor input[type=number],#editor textarea{width:100%;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--track);
  background:transparent;color:var(--ink);font:500 12px/1.35 var(--mono)}
#editor textarea{resize:vertical;min-height:54px;font-family:var(--sans)}
#editor .vec{display:flex;gap:4px}
#editor .col{display:flex;gap:6px;align-items:center}
#editor input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--track);border-radius:8px;background:none;cursor:pointer;flex:none}
#editor .add{width:100%;margin:6px 0 8px;padding:6px;font-size:11px;border-style:dashed}
#editor .rebuild{font:600 9px/1 var(--mono);letter-spacing:.1em;color:var(--accent);border:1px solid currentColor;border-radius:5px;padding:2px 4px}
#editor #json{width:100%;height:calc(100% - 50px);min-height:300px;font:500 11.5px/1.45 var(--mono);white-space:pre;tab-size:2}
#editor .jsonbar{display:flex;gap:6px;margin:8px 0}
#editor .msg{font:500 11px/1.4 var(--mono);color:var(--accent);min-height:1.4em;padding:4px 18px 10px}
#dpad{left:24px;bottom:120px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
#dpad button{width:52px;height:52px;border-radius:14px;background:var(--pill);border:1px solid var(--glass-b);font-size:16px;color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:none;user-select:none;-webkit-user-select:none}
#dpad button.on{background:var(--ink);color:var(--bg)}
#dpad [data-k=up]{grid-column:2;grid-row:1}#dpad [data-k=left]{grid-column:1;grid-row:2}#dpad [data-k=down]{grid-column:2;grid-row:2}#dpad [data-k=right]{grid-column:3;grid-row:2}
@media (pointer:coarse){#dpad{display:grid}}
@media (max-width:760px){#editor{width:100%;top:auto;height:82vh;border-radius:18px 18px 0 0;transform:translateY(102%)}#editor.open{transform:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="交互场景"></canvas>
<header id="masthead" class="ui"></header>
<aside id="panel" class="ui" aria-label="控制面板"></aside>
<footer id="howto" class="ui"></footer>
<aside id="editor" aria-label="配置编辑器"></aside>
<div id="fallback"><div class="card"></div></div>
<script type="module">
"use strict";

// ───────────────────────── Material Studies · shell ─────────────────────────
// A config-driven page shell shared by every study: masthead, status pill, glass control
// panel, how-to footer, fallback card, light/dark theme and a live configuration editor.
// A study supplies DEFAULT_CONFIG plus actions / formatters / hooks via Shell.mount().
const Shell = (() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
  function merge(base, over) {                     // deep merge; arrays are replaced wholesale
    if (over === undefined) return clone(base);
    if (!isObj(base) || !isObj(over)) return clone(over);
    const o = clone(base);
    for (const k in over) o[k] = k in base ? merge(base[k], over[k]) : clone(over[k]);
    return o;
  }
  function diff(base, cur) {                       // the minimal override that turns base into cur
    if (isObj(base) && isObj(cur)) {
      const o = {}; let any = false;
      for (const k in cur) { const d = diff(base[k], cur[k]); if (d !== undefined) { o[k] = d; any = true; } }
      return any ? o : undefined;
    }
    return JSON.stringify(base) === JSON.stringify(cur) ? undefined : clone(cur);
  }
  const getPath = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
  const setPath = (o, p, v) => { const ks = p.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgba = (h, a) => `rgba(${rgb(h).join(',')},${a})`;
  const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));

  const LABELS = {
    meta: '元信息', id: '标识', title: '标题', ui: '界面文字', eyebrow: '眉线', lede: '简介', howto: '玩法', howtoDetail: '玩法说明',
    fallbackTitle: '备用卡片标题', fallbackText: '备用卡片正文', theme: '主题', fonts: '字体', serif: '衬线体', sans: '无衬线体', mono: '等宽体',
    light: '浅色主题', dark: '深色主题', bg: '背景', ink: '主文字', ink2: '次文字', ink3: '弱文字', accent: '强调色', accent2: '强调色 2', glass: '玻璃底色',
    darkAt: '深色切换点', panel: '控制面板', tag: '角标', items: '控件', type: '类型', buttons: '按钮', action: '动作', label: '文字', primary: '主按钮',
    counts: '计数', bind: '绑定', source: '数据源', min: '最小值', max: '最大值', format: '格式', state: '初始状态', flavour: '风味', firmness: '硬度',
    damping: '波浪阻尼', day: '一天时间', flavours: '果冻风味', name: '名称', swatch: '色块', tint: '透射色', glow: '散射色', density: '浓度',
    sunElevation: '太阳高度 °', sunAzimuth: '太阳方位 °', sunIntensity: '太阳强度', sunColor: '阳光颜色', backdrop: '背景色', sky: '天空色',
    ambient: '环境光', moon: '月光', night: '夜晚程度', stars: '星星', fire: '营火', sim: '模拟', wind: '风', strength: '强度', gust: '阵风',
    swing: '风向摆动', waves: '波浪', gravity: '重力', tensionSoft: '表面张力（软）', tensionFirm: '表面张力（硬）', dampingMin: '阻尼下限',
    dampingMax: '阻尼上限', ambientSwell: '背景涌浪', jelly: '果冻', wobbleSoft: '摇晃刚度（软）', wobbleFirm: '摇晃刚度（硬）', maxShear: '最大剪切',
    bodies: '刚体', cannonSpeed: '炮弹初速', cannonElevation: '炮口仰角', coinsPerDrop: '每次金币数', flames: '火焰粒子 /秒', embers: '余烬 /秒',
    smoke: '烟 /秒', camera: '相机', azimuth: '方位角', elevation: '仰角', distance: '距离', target: '注视点', fov: '视场角', scene: '场景布局',
    island: '岛屿', x: 'x', z: 'z', radiusX: '半径 x', radiusZ: '半径 z', hills: '丘陵高度', cove: '小湾深度', ship: '船', anchor: '锚',
    skull: '骷髅岩', yaw: '朝向', scale: '缩放', camp: '营地', chest: '宝箱', xmark: 'X 标记', shovel: '铲子', rowboat: '划艇', wreck: '沉船',
    palms: '棕榈树', height: '高度', lean: '倾斜', flora: '植被', bushes: '灌木', ferns: '蕨类', grassTufts: '草丛', shoreRocks: '岸边岩石',
    kelpClumps: '海带丛', trappedBubbles: '果冻气泡', seabedCoins: '海底金币', seed: '随机种子', speed: '速度', hue: '色相', size: '大小',
  };
  const label = k => LABELS[k] ?? k;

  const S = { cfg: null, defaults: null, state: {}, opts: null, key: '', saveT: 0 };

  // ── theme ──
  function applyTheme() {
    const t = S.cfg.theme, f = t.fonts || {};
    const block = (sel, c, dark) => `${sel}{--bg:${c.bg};--ink:${c.ink};--ink2:${c.ink2};--ink3:${c.ink3};--accent:${c.accent};--accent2:${c.accent2};` +
      `--glass:${rgba(c.glass, dark ? 0.6 : 0.62)};--glass-b:${rgba(c.ink, dark ? 0.12 : 0.1)};--track:${rgba(c.ink, dark ? 0.18 : 0.14)};` +
      `--pill:${rgba(c.glass, dark ? 0.7 : 0.75)};--shadow:0 18px 50px -20px ${dark ? 'rgba(0,0,0,.7)' : rgba(c.ink, 0.35)};}`;
    let el = $('theme-live');
    if (!el) { el = document.createElement('style'); el.id = 'theme-live'; document.head.appendChild(el); }
    el.textContent = `:root{--serif:${f.serif};--sans:${f.sans};--mono:${f.mono}}` + block('html:root', t.light, false) + block('html body.dark', t.dark, true);
  }
  function setDark(on) { document.body.classList.toggle('dark', !!on); }

  // ── static chrome ──
  const rich = s => esc(s).replace(/\[([^\]]+)\]/g, '<kbd>$1</kbd>');
  function renderMasthead() {
    const u = S.cfg.ui, [a, b] = u.title || [];
    const st = $('status');
    const keep = st ? { cls: st.className, txt: st.querySelector('span').textContent } : { cls: '', txt: 'WebGPU · 启动中' };
    $('masthead').innerHTML = `<div class="eyebrow"><i></i>${esc(u.eyebrow)}</div><h1><span>${esc(a)}</span><span><em>${esc(b)}</em></span></h1>

  }
  function renderHowto() {
    $('howto').innerHTML = `<div class="line">${rich(S.cfg.ui.howto)}</div><p>${esc(S.cfg.ui.howtoDetail)}</p>`;
  }
  function renderFallback(msg) {
    $('fallback').querySelector('.card').innerHTML = `<div class="eyebrow"><i></i>${esc(S.cfg.ui.eyebrow)}</div><h3>${esc(S.cfg.ui.fallbackTitle)}</h3>
      <p>${msg ? msg : esc(S.cfg.ui.fallbackText)}</p><p>Chrome / Edge：<code>chrome://flags/#enable-unsafe-webgpu</code></p>`;
  }

  // ── control panel (generated from cfg.panel) ──
  function fmt(item, v) { const f = item.format && S.opts.formatters?.[item.format]; return f ? f(v, S.cfg) : String(v); }
  function renderPanel() {
    const P = $('panel'), open = P.classList.contains('open');
    let h = `<button class="handle" id="handle" aria-expanded="${open}"><i></i><span>控制</span></button>`;
    for (const sec of S.cfg.panel) {
      h += '<section class="sec">';
      if (sec.title) h += `<h2>${esc(sec.title)} <small>${esc(sec.tag || '')}</small></h2>`;
      for (const it of sec.items || []) {
        if (it.type === 'buttons') h += `<div class="row" style="margin-top:6px">${(it.buttons || []).map(b => `<button data-action="${esc(b.action)}" class="${b.primary ? 'primary' : ''}">${esc(b.label)}</button>`).join('')}</div>`;
        else if (it.type === 'meter') h += `<div class="meter"><div class="lbl"><span>${esc(it.label)}</span><span id="meterv-${esc(it.id)}">—</span></div><div class="bar"><i id="meter-${esc(it.id)}"></i></div></div>`;
        else if (it.type === 'counts') h += `<div class="counts">${(it.counts || []).map(c => `<div><b id="count-${esc(c.id)}">0</b>${esc(c.label)}</div>`).join('')}</div>`;
        else if (it.type === 'swatches') h += `<div class="flav" data-bind="${esc(it.bind)}">${(S.cfg[it.source] || []).map((o, i) =>
          `<button data-i="${i}" aria-pressed="${S.state[it.bind] === i}"><i style="background:${esc(o.swatch)}"></i>${esc(o.name)}</button>`).join('')}</div>`;
        else if (it.type === 'slider') h += `<div class="slider"><div class="lbl"><span>${esc(it.label)}</span><output data-out="${esc(it.bind)}">${esc(fmt(it, S.state[it.bind]))}</output></div>
          <input type="range" data-bind="${esc(it.bind)}" min="${it.min ?? 0}" max="${it.max ?? 100}" step="${it.step ?? 1}" value="${S.state[it.bind]}" aria-label="${esc(it.label)}"></div>`;
      }
      h += '</section>';
    }
    P.innerHTML = h;
    $('handle').onclick = () => { P.classList.toggle('open'); $('handle').setAttribute('aria-expanded', P.classList.contains('open')); };
    P.querySelectorAll('[data-action]').forEach(b => b.onclick = () => S.opts.actions?.[b.dataset.action]?.(b));
    P.querySelectorAll('.flav').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => setState(g.dataset.bind, +b.dataset.i)));
    P.querySelectorAll('input[type=range]').forEach(r => r.addEventListener('input', () => setState(r.dataset.bind, +r.value)));
  }
  function findItem(bind) { for (const s of S.cfg.panel) for (const it of s.items || []) if (it.bind === bind) return it; return {}; }
  function setState(k, v, silent) {
    S.state[k] = v;
    const P = $('panel');
    P.querySelectorAll(`.flav[data-bind="${k}"] button`).forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === v));
    const r = P.querySelector(`input[data-bind="${k}"]`); if (r && +r.value !== v) r.value = v;
    const o = P.querySelector(`output[data-out="${k}"]`); if (o) o.textContent = fmt(findItem(k), v);
    if (!silent) S.opts.onState?.(k, v, S.state);
  }
  const meter = (id, v01, text) => { const b = $('meter-' + id), t = $('meterv-' + id); if (b) b.style.width = (Math.max(0, Math.min(1, v01)) * 100).toFixed(1) + '%'; if (t && text != null) t.textContent = text; };
  const count = (id, n) => { const e = $('count-' + id); if (e && e.textContent !== String(n)) e.textContent = n; };
  const buttonLabel = (action, text) => { const b = $('panel').querySelector(`[data-action="${action}"]`); if (b) b.textContent = text; };
  function status(cls, text) { const s = $('status'); if (!s) return; s.className = cls; s.querySelector('span').textContent = text; }
  function fail(msg) { renderFallback(msg); document.body.classList.add('na'); status('na', 'WebGPU · 不可用'); console.error('[study] ' + (msg || 'no WebGPU')); }

  // ── config editor ──
  let tab = 'form';
  function toggleEditor(force) {
    const E = $('editor'), open = force ?? !E.classList.contains('open');
    if (open) renderEditor();
    E.classList.toggle('open', open);
    $('cfgBtn')?.setAttribute('aria-expanded', open);
  }
  function msg(t) { const m = $('editor').querySelector('.msg'); if (m) m.textContent = t; }
  function isRebuild(path) { return (S.opts.rebuild || []).some(p => path === p || path.startsWith(p + '.')); }
  function field(path, key, v) {
    const id = 'f-' + path.replace(/\./g, '-'), L = `<label for="${id}" title="${esc(path)}">${esc(label(key))}</label>`;
    if (isHex(v)) return `<div class="f">${L}<div class="col"><input type="color" data-p="${path}" data-k="hex" value="${v}"><input type="text" id="${id}" data-p="${path}" data-k="hex" value="${v}"></div></div>`;
    if (typeof v === 'number') return `<div class="f">${L}<input type="number" id="${id}" data-p="${path}" data-k="num" value="${v}" step="${Math.abs(v) >= 20 || Number.isInteger(v) && Math.abs(v) >= 2 ? 1 : Math.abs(v) < 0.01 && v !== 0 ? 0.00001 : 0.01}"></div>`;
    if (typeof v === 'boolean') return `<div class="f">${L}<input type="checkbox" id="${id}" data-p="${path}" data-k="bool" ${v ? 'checked' : ''}></div>`;
    if (typeof v === 'string') return v.length > 48 ? `<div class="f wide">${L}<textarea id="${id}" data-p="${path}" data-k="str" rows="${Math.min(6, Math.ceil(v.length / 44))}">${esc(v)}</textarea></div>`
      : `<div class="f">${L}<input type="text" id="${id}" data-p="${path}" data-k="str" value="${esc(v)}"></div>`;
    if (Array.isArray(v) && v.every(x => typeof x === 'number' || typeof x === 'string'))
      return `<div class="f">${L}<div class="vec">${v.map((x, i) => `<input type="${typeof x === 'number' ? 'number' : 'text'}" data-p="${path}.${i}" data-k="${typeof x === 'number' ? 'num' : 'str'}" value="${esc(x)}" step="0.01">`).join('')}</div></div>`;
    return group(path, key, v);
  }
  function group(path, key, v) {
    const rb = isRebuild(path) && !isRebuild(path.split('.').slice(0, -1).join('.')) ? ' <span class="rebuild">重建</span>' : '';
    if (Array.isArray(v)) {
      const items = v.map((x, i) => {
        const nm = isObj(x) ? (x.name || x.title || x.label || x.type || '') : '';
        return `<details><summary>#${i + 1} <small>${esc(nm)}</small><button class="rm" data-rm="${path}" data-i="${i}" title="删除">×</button></summary>${Object.keys(x).map(k => field(`${path}.${i}.${k}`, k, x[k])).join('')}</details>`;
      }).join('');
      return `<details><summary>${esc(label(key))} <small>${v.length}</small>${rb}</summary>${items}<button class="add" data-add="${path}">＋ 复制最后一项</button></details>`;
    }
    return `<details${path.split('.').length === 1 && ['ui', 'flavours'].includes(path) ? ' open' : ''}><summary>${esc(label(key))}${rb}</summary>${Object.keys(v).map(k => field(path ? `${path}.${k}` : k, k, v[k])).join('')}</details>`;
  }
  function renderEditor() {
    const E = $('editor'), body = E.querySelector('.body'), scroll = body ? body.scrollTop : 0;
    const openSet = new Set([...E.querySelectorAll('details[open]>summary')].map(s => s.parentElement.dataset.path).filter(Boolean));
    E.innerHTML = `<header><div class="eyebrow"><i></i>${esc(S.cfg.ui.eyebrow)}</div><h2>配置作品 <button class="ui-btn" id="edClose" style="margin:0">关闭 ✕</button></h2>
      <p>修改即时生效；标有「重建」的分组会重新生成场景。配置自动保存在本机浏览器。</p></header>
      <div class="edbar"><button id="edExport">导出 JSON</button><button id="edImport">导入 JSON</button><button id="edShare">复制分享链接</button><button id="edReset">恢复默认</button></div>
      <div class="tabs" role="tablist"><button role="tab" data-tab="form" aria-selected="${tab === 'form'}">表单</button><button role="tab" data-tab="json" aria-selected="${tab === 'json'}">JSON</button></div>
      <div class="body">${tab === 'form' ? Object.keys(S.cfg).filter(k => k !== 'meta').map(k => field(k, k, S.cfg[k])).join('')
        : `<div class="jsonbar"><button id="jsonApply" class="primary">应用 JSON</button><button id="jsonFmt">格式化</button></div><textarea id="json" spellcheck="false">${esc(JSON.stringify(S.cfg, null, 2))}</textarea>`}</div>
      <div class="msg"></div><input type="file" id="edFile" accept="application/json,.json" hidden>`;
    // remember which groups were open, keyed by path
    E.querySelectorAll('details').forEach(d => { const f = d.querySelector('[data-p],[data-add]'); const p = f ? (f.dataset.p || f.dataset.add) : ''; d.dataset.path = p.split('.').slice(0, 2).join('.') + '|' + d.querySelector('summary').textContent.trim().slice(0, 12); if (openSet.has(d.dataset.path)) d.open = true; });
    E.querySelector('.body').scrollTop = scroll;
    $('edClose').onclick = () => toggleEditor(false);
    E.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderEditor(); });
    $('edExport').onclick = () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S.cfg, null, 2)], { type: 'application/json' }));
      a.download = (S.cfg.meta?.id || 'study') + '.config.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); msg('已导出配置文件。');
    };
    $('edImport').onclick = () => $('edFile').click();
    $('edFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { replaceConfig(JSON.parse(await f.text())); msg('已导入：' + f.name); } catch (err) { msg('导入失败：' + err.message); } };
    $('edShare').onclick = async () => {
      const d = diff(S.defaults, S.cfg), url = location.origin + location.pathname + location.search + (d ? '#cfg=' + b64e(JSON.stringify(d)) : '');
      history.replaceState(null, '', url);
      msg('地址栏已更新为分享链接（' + url.length + ' 字符）。');
      try { await navigator.clipboard.writeText(url); msg('分享链接已复制（' + url.length + ' 字符）。'); } catch { prompt('复制这个链接：', url); }
    };
    $('edReset').onclick = () => { if (confirm('恢复全部默认配置？当前修改会丢失。')) { replaceConfig(clone(S.defaults)); history.replaceState(null, '', location.pathname + location.search); msg('已恢复默认。'); } };
    if (tab === 'json') {
      $('jsonApply').onclick = () => { try { replaceConfig(JSON.parse($('json').value)); msg('JSON 已应用。'); } catch (err) { msg('JSON 有误：' + err.message); } };
      $('jsonFmt').onclick = () => { try { $('json').value = JSON.stringify(JSON.parse($('json').value), null, 2); } catch (err) { msg('JSON 有误：' + err.message); } };
      return;
    }
    E.querySelectorAll('[data-p]').forEach(inp => inp.addEventListener('input', () => {
      const p = inp.dataset.p, k = inp.dataset.k;
      const v = k === 'num' ? parseFloat(inp.value) : k === 'bool' ? inp.checked : inp.value;
      if (k === 'num' && !Number.isFinite(v)) return;
      if (k === 'hex') { if (!isHex(v)) return; inp.parentElement.querySelectorAll('input').forEach(o => { if (o !== inp) o.value = v; }); }
      setPath(S.cfg, p, v); changed(p);
    }));
    E.querySelectorAll('[data-rm]').forEach(b => b.onclick = e => {
      e.preventDefault(); const arr = getPath(S.cfg, b.dataset.rm); if (arr.length <= 1) return msg('至少保留一项。');
      arr.splice(+b.dataset.i, 1); changed(b.dataset.rm); renderEditor();
    });
    E.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const arr = getPath(S.cfg, b.dataset.add); arr.push(clone(arr[arr.length - 1])); changed(b.dataset.add); renderEditor(); });
  }

  // ── change propagation ──
  let rebuildT = 0;
  function changed(path) {
    const top = path.split('.')[0];
    if (top === 'ui' || top === 'meta') { renderMasthead(); renderHowto(); }
    if (top === 'theme') applyTheme();
    if (top === 'panel' || top === 'state' || (S.opts.panelDeps || []).includes(top)) {

  function save() { try { const d = diff(S.defaults, S.cfg); if (d) localStorage.setItem(S.key, JSON.stringify(d)); else localStorage.removeItem(S.key); } catch { } }

    S.cfg = merge(S.defaults, over || {});
    for (const k in S.cfg.state) S.state[k] = S.cfg.state[k];
    applyTheme(); renderMasthead(); renderHowto(); renderPanel(); renderFallback();
    addEventListener('keydown', e => { if (e.key === 'Escape' && $('editor').classList.contains('open')) toggleEditor(false); });
    return S.cfg;
  }
  return {
    mount, status, fail, setDark, meter, count, buttonLabel, setState, toggleEditor,
    get cfg() { return S.cfg; }, get state() { return S.state; },
    util: { merge, diff, clone, getPath, setPath },
  };
})();

function palmPath(P, t) { return [P.lean[0] * P.h * t * t, P.h * t, P.lean[1] * P.h * t * t]; }

// pour a config.scene object into the module-level layout tables
function applySceneConfig(sc) {

  Object.assign(LAYOUT, { island: [I.x, I.z, I.radiusX, I.radiusZ], hills: I.hills, cove: I.cove, ship: [...sc.ship], anchor: [...sc.anchor],
    skull: [sc.skull.x, sc.skull.z, sc.skull.yaw], skullScale: sc.skull.scale, fire: [...C.fire], chest: [...C.chest], xmark: [...C.xmark],
    shovel: [...C.shovel], rowboat: [...C.rowboat], wreck: [...sc.wreck] });

  for (const P of sc.palms.slice(0, NODE.NPALM)) PALMS.push({ x: P.x, z: P.z, h: P.height, lean: [...P.lean] });

}
function buildPalm(b, P, idx, node = NODE.PALM + idx) {
  b.node = node;
  const lc = hexc(0xc98a3e), dc = hexc(0x8e5524);
  b.push().m(0).tube(t => palmPath(P, t), (t, u) => 0.042 * (1 - 0.42 * t) * (1 + 0.16 * Math.pow(1 - ((t * 15) % 1), 3)), 60, 9,
    { col: (u, t) => ((t * 15) % 1) < 0.28 ? dc : lc, w: (u, t) => t }).pop();
  const top = palmPath(P, 1);
  b.push().m(0, 1).c(hexc(0x5b3a1e));
  for (let k = 0; k < 3; k++) { const a = k * 2.1 + idx; b.push().t(top[0] + Math.cos(a) * 0.035, top[1] - 0.035, top[2] + Math.sin(a) * 0.035).sphere(0.03, 0.032, 0.03, 8, 6).pop(); }
  b.pop();
  const n = 8, L0 = 0.46 + 0.08 * hash1(idx * 7.3);
  for (let k = 0; k < n; k++) {
    const a = k / n * TAU + idx * 0.7 + 0.25 * hash1(k + idx * 13), dir = [Math.cos(a), 0, Math.sin(a)], side = [-dir[2], 0, dir[0]];
    const L = L0 * (0.85 + 0.3 * hash1(k * 3.1 + idx)), droop = 0.7 + 0.35 * hash1(k * 5.7 + idx);
    const g0 = hexc(0x2f9c45), g1 = hexc(0x8ad85a);
    b.push().m(2).surf(6, 14, (x, s) => {
      const xx = x * 2 - 1, wv = 0.085 * Math.sin(PI * Math.pow(s, 0.75)) * (0.72 + 0.28 * Math.abs(Math.sin(s * 34)));
      const sp = vadd(top, [dir[0] * L * s, L * (0.32 * s - droop * s * s), dir[2] * L * s]);
      return vadd(sp, [side[0] * xx * wv, -Math.abs(xx) * wv * 0.45, side[2] * xx * wv]);
    }, { col: (x, s) => vlerp(g0, g1, s * 0.8 + 0.2 * Math.abs(x * 2 - 1)), w: (x, s) => 1 + s }).pop();
  }
  P.top = top;
}

  // rowboat — bow up on the sand
  { const [rx, rz] = LAYOUT.rowboat, ry = T0(rx, rz);
    b.push().t(rx, Math.max(ry, WL - 0.03) + 0.02, rz).ry(PI + 0.35).rx(-0.08).s(0.34, 0.42, 0.34);
    for (const side of [-1, 1]) b.surf(16, 6, (u, v) => { const p = HULL.pt(lerp(0.0, 1, u), lerp(0.3, 1, v), side); return [p[0], p[1] - 0.2, p[2]]; },
      { flip: side < 0, col: (u, v, p) => p[1] > -0.025 ? hexc(0xe6dccb) : hexc(0x6b4a2e) });
    b.c(COL.wood);
    for (const z of [-0.3, 0.05, 0.35]) b.push().t(0, -0.06, z).box(0.36, 0.02, 0.09).pop();
    b.c(COL.woodD).push().t(0, -0.13, 0).box(0.25, 0.012, 1.3).pop();
    b.pop();
    b.push().c(COL.wood).line([rx - 0.08, ry + 0.07, rz - 0.15], [rx + 0.12, ry + 0.05, rz + 0.25], 0.006, 5).pop();
  }
}

function buildIslandFlora(b, info) {
  b.node = 0;
  _seed = Math.max(1, Math.floor(FLORA.seed)) || 4242;
  const onIsland = (x, z) => T0(x, z);
  const nearCamp = (x, z) => Math.hypot(x - LAYOUT.fire[0], z - LAYOUT.fire[1]) < 0.5 || Math.hypot(x - LAYOUT.chest[0], z - LAYOUT.chest[1]) < 0.3
    || Math.hypot(x - LAYOUT.xmark[0], z - LAYOUT.xmark[1]) < 0.25 || Math.hypot(x - LAYOUT.chest[0] - 0.42, z - LAYOUT.chest[1] - 0.08) < 0.3 || Math.hypot(x - LAYOUT.rowboat[0], z - LAYOUT.rowboat[1]) < 0.3;
  const sample = (n, ok) => { const out = []; let guard = 0; while (out.length < n && guard++ < 6000) { const x = rr(-2.2, 2.5), z = rr(-2.55, -0.5), y = onIsland(x, z); if (ok(x, z, y) && !nearCamp(x, z)) out.push([x, y, z]); } return out; };
  info.bushes = [];
  // jelly bushes with flowers
  const greens = [0x2f9a48, 0x48b85a, 0x1f7d3f, 0x5cc46a];
  for (const [x, y, z] of sample(FLORA.bushes, (x, z, y) => y > WL + 0.2)) {
    const n = 3 + Math.floor(rnd() * 3), base = hexc(greens[Math.floor(rnd() * 4)]);
    for (let i = 0; i < n; i++) {
      const r = rr(0.06, 0.12), ox = rr(-0.1, 0.1), oz = rr(-0.1, 0.1);
      b.push().m(7).c(vscale(base, rr(0.85, 1.15))).t(x + ox, y + r * 0.55, z + oz).sphere(r, r * 0.85, r, 12, 8, p => 0.08 * noise3(p[0] * 3 + i, p[1] * 3, p[2] * 3)).pop();
    }
    const fc = [0xff6fa8, 0xffd23f, 0xff4b3a, 0xfff4e0][Math.floor(rnd() * 4)];
    for (let i = 0; i < 4; i++) b.push().m(7).c(hexc(fc)).t(x + rr(-0.12, 0.12), y + rr(0.12, 0.2), z + rr(-0.12, 0.12)).sphere(0.018, 0.012, 0.018, 6, 4).pop();
    info.bushes.push([x, y + 0.15, z]);
  }
  // ferns
  for (const [x, y, z] of sample(FLORA.ferns, (x, z, y) => y > WL + 0.16)) {
    for (let k = 0; k < 6; k++) {
      const a = k / 6 * TAU + rnd(), dir = [Math.cos(a), 0, Math.sin(a)], side = [-dir[2], 0, dir[0]], L = rr(0.14, 0.2);
      b.push().m(2).surf(4, 8, (xx, s) => {
        const w = 0.03 * Math.sin(PI * s) * (0.6 + 0.4 * Math.abs(Math.sin(s * 28))), q = xx * 2 - 1;
        return [x + dir[0] * L * s + side[0] * q * w, y + L * (0.9 * s - 1.0 * s * s), z + dir[2] * L * s + side[2] * q * w];
      }, { col: (xx, s) => vlerp(hexc(0x2a7a35), hexc(0x6fc34e), s), w: (xx, s) => 1 + s * 0.6 }).pop();
    }
  }
  // beach grass tufts
  for (const [x, y, z] of sample(FLORA.grassTufts, (x, z, y) => y > WL + 0.05 && y < WL + 0.22)) {
    for (let k = 0; k < 7; k++) {
      const a = rnd() * TAU, lean = rr(0.15, 0.5), H = rr(0.08, 0.15), dir = [Math.cos(a), 0, Math.sin(a)], side = [-dir[2], 0, dir[0]];
      b.push().m(2).surf(1, 5, (xx, s) => {
        const w = 0.006 * (1 - s), q = xx * 2 - 1;
        return [x + dir[0] * lean * H * s * s + side[0] * q * w, y + H * s, z + dir[2] * lean * H * s * s + side[2] * q * w];
      }, { col: (xx, s) => vlerp(hexc(0x8a9a3a), hexc(0xd8d27a), s), w: (xx, s) => 1 + s }).pop();
    }
  }
  // shore rocks
  info.rocks = [];
  for (const [x, y, z] of sample(FLORA.shoreRocks, (x, z, y) => Math.abs(y - WL) < 0.07)) {
    const r = rr(0.05, 0.11); b.push().t(x, y + r * 0.2, z).ry(rnd() * TAU); rock(b, r, rnd() * 50); b.pop();
    info.rocks.push({ c: [x, y + r * 0.2, z], r: r * 0.85 });
  }
}

function buildSkull(b, info) {
  b.node = 0;
  const [sx, sz, yaw] = LAYOUT.skull, sy = T0(sx, sz) - 0.08;
  const SK = LAYOUT.skullScale;
  info.skull = { p: [sx, sy, sz], yaw, s: SK };
  const { P, I } = surfaceNets((x, y, z) => skullSDF(x, y, z), [-0.78, -0.12, -0.7], [0.78, 1.32, 0.72], [70, 64, 64]);
  const M = M4.mul(M4.mul(M4.T(sx, sy, sz), M4.RY(yaw)), M4.S(SK));
  const base = b.count;
  const e = 0.004;
  for (const p of P) {
    const [x, y, z] = p;
    const n = vnorm([skullSDF(x + e, y, z) - skullSDF(x - e, y, z), skullSDF(x, y + e, z) - skullSDF(x, y - e, z), skullSDF(x, y, z + e) - skullSDF(x, y, z - e)]);
    const wy = sy + y * SK;   // block-local height
    let c = vlerp(hexc(0x8f8477), hexc(0xb59a76), 0.5 + 0.5 * Math.sin(y * 26 + 2 * noise3(x * 2, y * 3, z * 2)));
    c = vscale(c, 0.85 + 0.25 * noise3(x * 9, y * 9, z * 9));
    const crack = Math.abs(x - 0.05 - 0.035 * Math.sin(z * 15 + 1)) < 0.03 && y > 0.9;
    if (crack) c = vscale(c, 0.45);
    const moss = smooth(0.45, 0.85, n[1]) * smooth(0.82, 1.0, y) * (0.6 + 0.4 * noise3(x * 6, y * 6, z * 6));
    c = vlerp(c, hexc(0x4f8f36), clamp(moss * 1.3, 0, 1));
    const wet = smooth(WL + 0.07, WL + 0.0, wy) * smooth(WL - 0.25, WL - 0.08, wy);
    c = vlerp(c, vscale(c, 0.5), wet);
    if (wy < WL - 0.08) c = vlerp(c, hexc(0x6e7d6a), 0.4);
    // eye sockets: smooth darkening + candle glow (continuous so the edges stay soft)
    const ex = (Math.abs(x) - EYE[0]) / 0.125, ey = (y - EYE[1]) / 0.14, ez = (z - EYE[2]) / 0.22;
    const eyeK = smooth(1.35, 0.95, Math.hypot(ex, ey, ez * 0.8)) * smooth(EYE[2] + 0.16, EYE[2] + 0.02, z);
    c = vscale(c, 1 - 0.8 * eyeK);
    const mat = 4, w = 0.2 * eyeK * smooth(EYE[2] + 0.12, EYE[2] - 0.1, z);
    const wp = M4.xp(M, p), wn = M4.xv(M, n);
    b.V.push(wp[0], wp[1], wp[2], wn[0], wn[1], wn[2], c[0], c[1], c[2], mat, w, 0);
  }
  for (const i of I) b.I.push(base + i);
  // teeth: two rows set into the grin
  b.push().apply(M).c(COL.bone).m(0);
  for (let row = 0; row < 2; row++) for (let i = 0; i < 6; i++) {
    const t = (i - 2.5) / 3.1, p = smileAt(t), sgn = row ? -1 : 1;
    b.push().t(p[0], p[1] + sgn * 0.02, p[2] + 0.004).ry(-t * 0.7);
    b.t(0, sgn * -0.004, 0).rz(rr(-0.08, 0.08)).box(0.042, 0.04 + 0.006 * Math.abs(t), 0.03);
    b.pop();
  }
  b.pop();
  const eyeW = (s) => M4.xp(M, [s * EYE[0], EYE[1], EYE[2] - 0.04]);
  info.skullEyes = [eyeW(-1), eyeW(1)];
}

function buildWreck(b, wx, wz, yaw, H) {
  const wy = H(wx, wz);
  b.push().t(wx, wy + 0.17, wz).ry(yaw).rz(1.25).s(0.9);
  const rot = hexc(0x5a4632), algae = hexc(0x4f6b3a);
  const wcol = (p) => vlerp(rot, algae, clamp(0.5 + 0.5 * noise3(p[0] * 6, p[1] * 6, p[2] * 6), 0, 1) * 0.7);
  for (let j = 0; j < 9; j++) {
    for (const side of [-1, 1]) {
      if (hash1(j * 7 + side * 3) < 0.28) continue;
      const u0 = 0.5 + 0.12 * hash1(j * 3.3 + side), v0 = j / 9, v1 = (j + 0.82) / 9;
      b.surf(10, 1, (u, v) => HULL.pt(lerp(u0, 1, u), lerp(v0, v1, v), side), { flip: side < 0, col: (u, v, p) => wcol(p) });
    }
  }
  for (let k = 0; k < 7; k++) {
    const u = 0.5 + k * 0.065;
    b.push().c(hexc(0x6b5238)).tube(t => { const s = t * 2 - 1; return HULL.pt(u, Math.abs(s) * 0.98, Math.sign(s) || 1); }, () => 0.012, 14, 5).pop();
  }
  b.push().c(hexc(0x6b5238)).line(HULL.pt(0.5, 0.97, -1), HULL.pt(0.5, 0.97, 1), 0.012, 5).line(HULL.pt(0.72, 0.97, -1), HULL.pt(0.72, 0.97, 1), 0.012, 5).pop();
  b.pop();
  // broken mast + yard
  const c = Math.cos(yaw + 0.6), sn = Math.sin(yaw + 0.6), at = (dx, dz) => [wx + c * dx + sn * dz, wz - sn * dx + c * dz];
  { const [x, z] = at(-0.55, -0.2); b.push().c(hexc(0x5f4a33)).t(x, H(x, z) + 0.03, z).ry(0.4 + yaw + 0.6).rz(PI / 2 - 0.12).t(0, -0.45, 0).cyl(0.025, 0.018, 0.85, 8).pop(); }
  { const [x, z] = at(-0.35, 0.15); b.push().c(hexc(0x5f4a33)).t(x, H(x, z) + 0.02, z).ry(-0.9 + yaw + 0.6).rz(PI / 2).t(0, -0.25, 0).cyl(0.012, 0.012, 0.5, 6).pop(); }
}
function buildKelp(b, kx, kz, H) {
  for (let s = 0; s < 4; s++) {
    const x = kx + rr(-0.12, 0.12), z = kz + rr(-0.12, 0.12), y0 = H(x, z), Hh = (WL - 0.1 - y0) * rr(0.6, 0.95), ph = rnd() * 6;
    if (Hh < 0.1) continue;
    const k0 = hexc(0x5d7a22), k1 = hexc(0xb7c74a);
    b.push().m(2).surf(2, 18, (xx, t) => {
      const w = 0.028 * (0.4 + 0.6 * Math.sin(PI * Math.min(t * 1.4, 1))), q = xx * 2 - 1;
      return [x + 0.05 * Math.sin(t * 7 + ph) + q * w, y0 + Hh * t, z + 0.04 * Math.cos(t * 5 + ph) + q * w * 0.4];
    }, { col: (xx, t) => vlerp(k0, k1, t), w: (xx, t) => 1 + t * 1.6 }).pop();
  }
}

// one streamed chunk of an infinite sea; geometry is local to the chunk corner (x0, z0)
function buildChunk(d, node) {
  const b = new MB(); b.node = node; _seed = d.seed % 2147483646 + 1;
  const H = (x, z) => terrainFn(x + d.x0, z + d.z0), L = (x, z) => [x - d.x0, z - d.z0];
  const rocks = [];
  for (const I of d.islets) {
    const [ix, iz] = L(I.x, I.z);
    for (let k = Math.max(1, Math.round(I.r * 2.4)); k--;) {
      const a = rnd() * TAU, r = rr(0, I.r * 0.45), x = ix + Math.cos(a) * r, z = iz + Math.sin(a) * r;
      b.push().t(x, H(x, z) - 0.02, z); buildPalm(b, { x, z, h: rr(0.6, 1.0), lean: [rr(-0.3, 0.3), rr(-0.3, 0.3)] }, d.seed % 997 + k, node); b.pop();
    }
    b.node = node;
    for (let k = Math.round(I.r * 5); k--;) {
      const a = rnd() * TAU, r = rr(I.r * 0.75, I.r * 1.05), x = ix + Math.cos(a) * r, z = iz + Math.sin(a) * r, rs = rr(0.05, 0.12);
      b.push().t(x, H(x, z) + rs * 0.2, z).ry(rnd() * TAU); rock(b, rs, rnd() * 50); b.pop();
    }
    for (let k = Math.round(I.r * 3); k--;) {
      const a = rnd() * TAU, r = rr(0, I.r * 0.5), x = ix + Math.cos(a) * r, z = iz + Math.sin(a) * r, rs = rr(0.07, 0.13);
      b.push().m(7).c(vscale(hexc([0x2f9a48, 0x48b85a, 0x1f7d3f][k % 3]), rr(0.85, 1.15))).t(x, H(x, z) + rs * 0.5, z).sphere(rs, rs * 0.85, rs, 12, 8).pop();
      const fc = [0xff6fa8, 0xffd23f, 0xff4b3a][k % 3];
      b.push().m(7).c(hexc(fc)).t(x + rr(-0.06, 0.06), H(x, z) + rs * 1.2, z + rr(-0.06, 0.06)).sphere(0.016, 0.011, 0.016, 6, 4).pop();
    }
  }
  for (const t of d.stacks) {   // sea stacks: weathered pillars poking out of the jelly
    const [x, z] = L(t.x, t.z), g = H(x, z), top = WL + t.h, hh = (top - g) / 2, sd = rnd() * 40;
    b.push().c(vscale(COL.rock, rr(0.8, 1.05))).t(x, g + hh, z).ry(rnd() * TAU)
      .sphere(t.r, hh, t.r * 0.85, 10, 9, p => 0.22 * noise3(p[0] * 2.4 + sd, p[1] * 3.5, p[2] * 2.4) - 0.12 * p[1]).pop();
    b.push().m(7).c(hexc(0x4f8f36)).t(x, top - 0.02, z).sphere(t.r * 0.55, 0.05, t.r * 0.5, 8, 5).pop();
    rocks.push([t.x, t.z, t.r * 1.15]);
  }
  if (d.wreck) { const [x, z] = L(d.wreck.x, d.wreck.z); buildWreck(b, x, z, d.wreck.yaw, H); }
  for (let k = d.kelp; k--;) { const x = rr(0.3, CHUNK - 0.3), z = rr(0.3, CHUNK - 0.3); if (H(x, z) < WL - 0.3) buildKelp(b, x, z, H); }
  for (let k = d.coins; k--;) { const x = rr(0.3, CHUNK - 0.3), z = rr(0.3, CHUNK - 0.3); if (H(x, z) < WL - 0.1) { b.push().t(x, H(x, z) + 0.004, z).rx(rr(-0.15, 0.15)); coinGeo(b, 0.035); b.pop(); } }
  for (let k = d.bubbles; k--;) {
    const x = rr(0.2, CHUNK - 0.2), z = rr(0.2, CHUNK - 0.2), g = H(x, z); if (g > WL - 0.15) continue;
    const r = rr(0.006, 0.026); b.push().m(9).c([0.9, 0.97, 1]).t(x, rr(g + 0.05, WL - 0.06), z).sphere(r, r, r, 8, 6).pop();
  }
  return { V: new Float32Array(b.V), I: new Uint32Array(b.I), rocks };
}

function buildSeabed(b, info) {
  b.node = 0;
  _seed = 777 + (Math.floor(FLORA.seed) % 1000);
  // wreck — fore half of a ship on her side
  const [wx, wz] = LAYOUT.wreck, wy = T0(wx, wz);
  buildWreck(b, wx, wz, -0.6, T0);
  info.wreck = [{ c: [wx, wy + 0.15, wz], r: 0.3 }, { c: [wx - 0.25, wy + 0.12, wz - 0.2], r: 0.22 }, { c: [wx + 0.25, wy + 0.12, wz + 0.2], r: 0.22 }];
  // kelp
  const kelpSpots = [[1.9, 0.3], [0.55, 1.95], [-1.65, 1.6], [2.05, 1.85], [-2.1, 0.4], [1.0, 0.25], [-0.9, 1.9], [2.2, -0.4]].slice(0, FLORA.kelpClumps);
  for (let g = 0; kelpSpots.length < FLORA.kelpClumps && g < 5000; g++) { const x = rr(-HALF + 0.3, HALF - 0.3), z = rr(-HALF + 0.3, HALF - 0.3); if (T0(x, z) < WL - 0.3) kelpSpots.push([x, z]); }
  for (const [kx, kz] of kelpSpots) buildKelp(b, kx, kz, T0);
  // doubloons on the floor
  for (let i = 0; i < FLORA.seabedCoins; i++) {
    const x = wx + rr(-0.6, 0.4), z = wz + rr(-0.5, 0.45), y = T0(x, z);
    b.push().t(x, y + 0.004, z).rx(rr(-0.15, 0.15)).rz(rr(-0.15, 0.15)); coinGeo(b, 0.035); b.pop();
  }
  // bubbles trapped in the jelly
  for (let i = 0; i < FLORA.trappedBubbles; i++) {
    const x = rr(-HALF + 0.2, HALF - 0.2), z = HALF > 3 ? rr(-HALF + 0.2, HALF - 0.2) : rr(-0.3, 2.4), y0 = T0(x, z); if (y0 > WL - 0.15) continue;
    const r = rr(0.006, 0.026), y = rr(y0 + 0.05, WL - 0.06);
    b.push().m(9).c([0.9, 0.97, 1]).t(x, y, z).sphere(r, r, r, 8, 6).pop();
  }
  // anchor on the bottom
  const [ax, az] = LAYOUT.anchor, ay = T0(ax, az);
  b.push().t(ax, ay + 0.035, az).ry(0.9).rz(1.3).m(1).c(COL.iron);
  b.cyl(0.013, 0.013, 0.3, 8);
  b.tube(t => { const a = PI * (1.15 + t * 0.7); return [Math.cos(a) * 0.12, 0.12 + Math.sin(a) * 0.12, 0]; }, () => 0.012, 10, 6);
  for (const s of [-1, 1]) { const a = PI * (s < 0 ? 1.15 : 1.85); b.push().t(Math.cos(a) * 0.12, 0.12 + Math.sin(a) * 0.12, 0).rz(s * 0.6).box(0.05, 0.06, 0.012).pop(); }
  b.push().t(0, 0.26, 0).rx(PI / 2).t(0, -0.11, 0).cyl(0.009, 0.009, 0.22, 6).pop();
  b.push().t(0, 0.31, 0).tube(t => [Math.cos(t * TAU) * 0.022, Math.sin(t * TAU) * 0.022, 0], () => 0.005, 12, 5).pop();
  b.pop();
  const AM = M4.mul(M4.mul(M4.T(ax, ay + 0.035, az), M4.RY(0.9)), M4.RZ(1.3));
  info.anchorRing = M4.xp(AM, [0, 0.31, 0]);
}

// dynamic object pools (one node per instance)
function buildPools(b) {
  for (let i = 0; i < NODE.NCHAIN; i++) {
    b.node = NODE.CHAIN + i;
    b.push().m(1).c(hexc(0x34312e)).tube(t => { const a = t * TAU; return [0, Math.sin(a) * 0.012, Math.cos(a) * 0.022]; }, () => 0.0045, 12, 5).pop();
  }
  for (let i = 0; i < NODE.NBALL; i++) { b.node = NODE.BALL + i; b.push().m(1).c(hexc(0x24221f)).sphere(0.055, 0.055, 0.055, 12, 8).pop(); }
  for (let i = 0; i < NODE.NBARREL; i++) { b.node = NODE.BARREL + i; b.push().m(0); barrelGeo(b); b.pop(); }
  for (let i = 0; i < NODE.NCOIN; i++) { b.node = NODE.COIN + i; b.push().t(0, -0.0045, 0); coinGeo(b, 0.04); b.pop(); }
  b.node = 0;
}

function buildIslets(b) {
  _seed = 9001;
  ISLETS.forEach((I, n) => {
    const np = Math.max(1, Math.round(I.r * 2.6));
    for (let k = 0; k < np; k++) {
      const a = rnd() * TAU, d = rr(0, I.r * 0.45), x = I.x + Math.cos(a) * d, z = I.z + Math.sin(a) * d;
      const P = { x, z, h: rr(0.65, 1.0), lean: [rr(-0.3, 0.3), rr(-0.3, 0.3)] };
      b.push().t(x, T0(x, z) - 0.02, z); buildPalm(b, P, 100 + n * 10 + k, 0); b.pop();
    }
    b.node = 0;
    for (let k = 0; k < Math.round(I.r * 5); k++) {
      const a = rnd() * TAU, d = rr(I.r * 0.75, I.r * 1.05), x = I.x + Math.cos(a) * d, z = I.z + Math.sin(a) * d, r = rr(0.05, 0.12);
      b.push().t(x, T0(x, z) + r * 0.2, z).ry(rnd() * TAU); rock(b, r, rnd() * 50); b.pop();
    }
    for (let k = 0; k < Math.round(I.r * 3); k++) {
      const a = rnd() * TAU, d = rr(0, I.r * 0.5), x = I.x + Math.cos(a) * d, z = I.z + Math.sin(a) * d, y = T0(x, z), r = rr(0.07, 0.13);
      b.push().m(7).c(vscale(hexc([0x2f9a48, 0x48b85a, 0x1f7d3f][k % 3]), rr(0.85, 1.15))).t(x, y + r * 0.5, z).sphere(r, r * 0.85, r, 12, 8).pop();
    }
  });
}

function buildWorld() {
  const t0 = performance.now();
  const b = new MB(), info = {};
  buildShip(b);
  PALMS.forEach((P, i) => buildPalm(b, P, i));
  buildCamp(b, info);
  buildIslandFlora(b, info);
  buildSkull(b, info);
  buildSeabed(b, info);
  buildIslets(b);
  buildPools(b);
  info.buildMs = performance.now() - t0;
  return { V: new Float32Array(b.V), I: new Uint32Array(b.I), info };
}

// terrain + jelly grids: vertex = (x, z, kind, side). kind 0 top, 1 wall top, 2 wall bottom
function buildGridMesh(res) {
  const V = [], I = [];
  for (let j = 0; j < res; j++) for (let i = 0; i < res; i++) V.push(-HALF + i / (res - 1) * BLOCK, -HALF + j / (res - 1) * BLOCK, 0, 0);
  for (let j = 0; j < res - 1; j++) for (let i = 0; i < res - 1; i++) { const a = j * res + i; I.push(a, a + res, a + 1, a + 1, a + res, a + res + 1); }
  // four walls (side: 0 +x, 1 -x, 2 +z, 3 -z), each a strip of res columns
  for (let s = 0; s < 4; s++) {
    const base = V.length / 4;
    for (let i = 0; i < res; i++) {
      const t = -HALF + i / (res - 1) * BLOCK;
      const [x, z] = s === 0 ? [HALF, t] : s === 1 ? [-HALF, t] : s === 2 ? [t, HALF] : [t, -HALF];
      V.push(x, z, 1, s, x, z, 2, s);
    }
    for (let i = 0; i < res - 1; i++) { const a = base + i * 2; if (s === 0 || s === 3) I.push(a, a + 2, a + 1, a + 2, a + 3, a + 1); else I.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
  }
  return { V: new Float32Array(V), I: new Uint32Array(I) };
}

// ───────────────────────── terrain (global heightfield) ─────────────────────────
function splatGrid(a, N, dx, ox, oz, x, z, r, amp, add = true) {
  const ci = (x - ox) / dx - 0.5, cj = (z - oz) / dx - 0.5, R = Math.ceil(r * 2 / dx);
  const i0 = Math.max(0, Math.floor(ci - R)), i1 = Math.min(N - 1, Math.ceil(ci + R)), j0 = Math.max(0, Math.floor(cj - R)), j1 = Math.min(N - 1, Math.ceil(cj + R));
  const k = 1 / (r * r);

    const ddx = (i - ci) * dx, ddz = (j - cj) * dx, g = Math.exp(-(ddx * ddx + ddz * ddz) * k) * amp;
    if (add) a[j * N + i] += g; else a[j * N + i] = Math.max(a[j * N + i], g);
  }
}
function sampGrid(a, N, dx, ox, oz, x, z) {
  const gx = (x - ox) / dx - 0.5, gz = (z - oz) / dx - 0.5;
  const i0 = Math.floor(gx), j0 = Math.floor(gz), fx = gx - i0, fz = gz - j0;
  const c = (i, j) => a[clamp(j, 0, N - 1) * N + clamp(i, 0, N - 1)];
  return lerp(lerp(c(i0, j0), c(i0 + 1, j0), fx), lerp(c(i0, j0 + 1), c(i0 + 1, j0 + 1), fx), fz);
}

  constructor() { this.load(); }
  gen(x, z) { return terrainFn(x + ORIGIN[0], z + ORIGIN[1]); }
  load() {
    this.N = TN; this.dx = TDX; this.ox = BC[0] - HALF; this.oz = BC[1] - HALF;
    this.h = new Float32Array(TN * TN);
    for (let j = 0; j < TN; j++) for (let i = 0; i < TN; i++) this.h[j * TN + i] = this.gen(this.ox + (i + 0.5) * TDX, this.oz + (j + 0.5) * TDX);
    this.dirty = true;
  }

  normal(x, z) { const e = this.dx; return vnorm([this.at(x - e, z) - this.at(x + e, z), 2 * e, this.at(x, z - e) - this.at(x, z + e)]); }

// ───────────────────────── shallow water (staggered grid, CPU) ─────────────────────────
// Simulated in a window of GN×GN cells. When the window is smaller than the block it follows
// a focus point (the ship) by whole-cell shifts and fades into the analytic swell at its rim.
const G_WAVE = 5.0;
class Water {
  constructor(terrain) {
    const N = this.N = GN; this.dx = GDX; this.terrain = terrain;
    this.eta = new Float32Array(N * N); this.P = new Float32Array(N * N); this.foam = new Float32Array(N * N);
    this.lap = new Float32Array(N * N); this.sponge = new Float32Array(N * N);
    this.u = new Float32Array((N + 1) * N); this.v = new Float32Array(N * (N + 1));
    this.tex = new Float32Array(N * N * 4); this.g = G_WAVE; this.time = 0;
    this.windowed = N * GDX < BLOCK - 1e-6;
    this.ox = this.oz = this.windowed ? -N * GDX / 2 : -HALF;
    const F = Math.max(SWELL.fade, 1);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const e = Math.min(i, j, N - 1 - i, N - 1 - j);
      this.sponge[j * N + i] = this.windowed ? lerp(0.97, 1, smooth(0, F, e)) : 1;
    }
    this.reset();
  }
  reset() { this.eta.fill(0); this.u.fill(0); this.v.fill(0); this.foam.fill(0); this.P.fill(0); this.updateDepth(); }
  updateDepth() {
    const N = this.N, D = this.D = new Float32Array(N * N), wet = this.wet = new Uint8Array(N * N);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x = this.ox + (i + 0.5) * this.dx, z = this.oz + (j + 0.5) * this.dx, k = j * N + i;
      const inside = inBlock(x, z);
      D[k] = inside ? Math.max(WL - this.terrain.at(x, z), 0) : 0; wet[k] = D[k] > 0.012 ? 1 : 0;
    }
  }
  // keep the window centred on a focus point (whole-cell shifts)
  follow(x, z) {
    if (!this.windowed) return;
    const N = this.N, dx = this.dx, half = N * dx / 2;
    const ki = Math.round((x - (this.ox + half)) / dx), kj = Math.round((z - (this.oz + half)) / dx);
    if (Math.abs(ki) < 6 && Math.abs(kj) < 6) return;
    const shift = (a, w, h) => {
      const o = new Float32Array(a.length);
      for (let j = 0; j < h; j++) { const sj = j + kj; if (sj < 0 || sj >= h) continue;
        for (let i = 0; i < w; i++) { const si = i + ki; if (si >= 0 && si < w) o[j * w + i] = a[sj * w + si]; } }
      a.set(o);
    };
    shift(this.eta, N, N); shift(this.foam, N, N); shift(this.u, N + 1, N); shift(this.v, N, N + 1);
    this.ox += ki * dx; this.oz += kj * dx;
    this.updateDepth();
  }
  samp(a, x, z) {
    const gx = (x - this.ox) / this.dx - 0.5, gz = (z - this.oz) / this.dx - 0.5, N = this.N;
    if (gx < -0.5 || gz < -0.5 || gx > N - 0.5 || gz > N - 0.5) return 0;
    const v = sampGrid(a, N, this.dx, this.ox, this.oz, x, z);
    return SWELL.fade > 0 ? v * smooth(0, SWELL.fade, Math.min(gx, gz, N - 1 - gx, N - 1 - gz)) : v;
  }
  height(x, z) { return WL + this.samp(this.eta, x, z) + swellAt(x, z, this.time); }
  ground(x, z) { return this.terrain.at(x, z); }
  groundN(x, z) { return this.terrain.normal(x, z); }
  slope(x, z) { const e = this.dx; return [(this.height(x + e, z) - this.height(x - e, z)) / (2 * e), (this.height(x, z + e) - this.height(x, z - e)) / (2 * e)]; }
  splat(a, x, z, r, amp, add = true) { splatGrid(a, this.N, this.dx, this.ox, this.oz, x, z, r, amp, add); }
  pressure(x, z, r, amp) { this.splat(this.P, x, z, r, amp); }
  splash(x, z, r, amp) {
    this.splat(this.eta, x, z, r, -amp); this.splat(this.eta, x, z, r * 2.2, amp * 0.22);
    this.splat(this.foam, x, z, r * 1.6, 1, false);
  }
  crater(x, z, r, depth) { this.terrain.crater(x, z, r, depth); this.updateDepth(); }
  step(dt, gx, gz, damp, tension) {
    const N = this.N, eta = this.eta, P = this.P, u = this.u, v = this.v, D = this.D, wet = this.wet, lap = this.lap, sp = this.sponge;
    const idx = 1 / this.dx, idx2 = idx * idx, kd = Math.exp(-damp * dt);
    if (tension > 0) {
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const k = j * N + i; if (!wet[k]) { lap[k] = 0; continue; }
        const e = eta[k];
        const l = i > 0 && wet[k - 1] ? eta[k - 1] : e, r = i < N - 1 && wet[k + 1] ? eta[k + 1] : e;
        const d = j > 0 && wet[k - N] ? eta[k - N] : e, t = j < N - 1 && wet[k + N] ? eta[k + N] : e;
        lap[k] = (l + r + d + t - 4 * e) * idx2;
      }
    }
    for (let j = 0; j < N; j++) for (let i = 1; i < N; i++) {
      const a = j * N + i - 1, b = a + 1, f = j * (N + 1) + i;
      if (!(wet[a] && wet[b])) { u[f] = 0; continue; }
      const du = -this.g * ((eta[b] + P[b]) - (eta[a] + P[a])) * idx + gx + tension * (lap[b] - lap[a]) * idx;
      u[f] = (u[f] + du * dt) * kd;
    }
    for (let j = 1; j < N; j++) for (let i = 0; i < N; i++) {
      const a = (j - 1) * N + i, b = a + N, f = j * N + i;
      if (!(wet[a] && wet[b])) { v[f] = 0; continue; }
      const dv = -this.g * ((eta[b] + P[b]) - (eta[a] + P[a])) * idx + gz + tension * (lap[b] - lap[a]) * idx;
      v[f] = (v[f] + dv * dt) * kd;
    }
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = j * N + i; if (!wet[k]) { eta[k] *= 0.9; continue; }
      const fl = j * (N + 1) + i, fb = j * N + i;
      const Dl = i > 0 ? 0.5 * (D[k] + D[k - 1]) : 0, Dr = i < N - 1 ? 0.5 * (D[k] + D[k + 1]) : 0;
      const Db = j > 0 ? 0.5 * (D[k] + D[k - N]) : 0, Dt = j < N - 1 ? 0.5 * (D[k] + D[k + N]) : 0;
      const div = (Dr * u[fl + 1] - Dl * u[fl]) + (Dt * v[fb + N] - Db * v[fb]);
      eta[k] = clamp(eta[k] - dt * div * idx, -0.6, 0.6) * sp[k];
    }
    // a whisper of viscosity keeps the grid smooth
    if (this.windowed) for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const k = j * N + i; u[j * (N + 1) + i] *= sp[k]; v[k] *= sp[k]; }
    const nu = 0.0025 * dt * idx2;
    for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
      const k = j * N + i; if (!wet[k]) continue;
      lap[k] = (eta[k - 1] + eta[k + 1] + eta[k - N] + eta[k + N] - 4 * eta[k]);
    }
    for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) { const k = j * N + i; if (wet[k]) eta[k] += nu * lap[k] * (wet[k - 1] & wet[k + 1] & wet[k - N] & wet[k + N]); }
  }
  finishFrame(dt) {
    const N = this.N, t = this.tex, eta = this.eta, foam = this.foam, D = this.D;
    let E = 0; const fd = Math.exp(-dt * 0.9);
    for (let k = 0; k < this.u.length; k++) E += this.u[k] * this.u[k] + this.v[k] * this.v[k];
    for (let k = 0; k < N * N; k++) {
      const e = eta[k];
      const shallow = D[k] < 0.25 ? 1 : 0.3;
      foam[k] = Math.max(foam[k] * fd, clamp((Math.abs(e) - 0.05) * 5 * shallow, 0, 1));
      t[k * 4] = e; t[k * 4 + 1] = foam[k];
    }
    this.P.fill(0);
    return E;
  }
}

// ───────────────────────── particles ─────────────────────────
const PCAP = 4000, PF = 12;
class Particles {
  constructor() {
    this.n = 0;
    this.a = {};
    for (const k of ['x', 'y', 'z', 'vx', 'vy', 'vz', 'life', 'max', 's0', 's1', 'r0', 'g0', 'b0', 'a0', 'r1', 'g1', 'b1', 'a1', 'kind', 'add', 'under', 'drag', 'grav', 'rot', 'rotv', 'lit', 'buoy', 'nf'])
      this.a[k] = new Float32Array(PCAP);
    this.out = new Float32Array(PCAP * PF);
  }
  emit(o) {
    if (this.n >= PCAP) return;
    const i = this.n++, a = this.a;
    a.x[i] = o.p[0]; a.y[i] = o.p[1]; a.z[i] = o.p[2];
    a.vx[i] = o.v ? o.v[0] : 0; a.vy[i] = o.v ? o.v[1] : 0; a.vz[i] = o.v ? o.v[2] : 0;
    a.life[i] = 0; a.max[i] = o.life || 1; a.s0[i] = o.s0 ?? 0.05; a.s1[i] = o.s1 ?? a.s0[i];
    const c0 = o.c0 || [1, 1, 1, 1], c1 = o.c1 || c0;
    a.r0[i] = c0[0]; a.g0[i] = c0[1]; a.b0[i] = c0[2]; a.a0[i] = c0[3]; a.r1[i] = c1[0]; a.g1[i] = c1[1]; a.b1[i] = c1[2]; a.a1[i] = c1[3];
    a.kind[i] = o.kind || 0; a.add[i] = o.add ? 1 : 0; a.under[i] = o.under ? 1 : 0; a.drag[i] = o.drag ?? 0.5; a.grav[i] = o.grav ?? 0;
    a.rot[i] = o.rot ?? Math.random() * TAU; a.rotv[i] = o.rotv ?? 0; a.lit[i] = o.lit ? 1 : 0; a.buoy[i] = o.buoy ? 1 : 0; a.nf[i] = o.nf ? 1 : 0;
  }
  kill(i) {
    const a = this.a, j = --this.n;
    if (i !== j) for (const k in a) a[k][i] = a[k][j];
  }
  step(dt, wind, water) {
    const a = this.a;
    for (let i = 0; i < this.n; i++) {
      a.life[i] += dt;
      if (a.life[i] >= a.max[i]) { this.kill(i); i--; continue; }
      const kd = Math.exp(-a.drag[i] * dt);
      a.vx[i] = a.vx[i] * kd + wind[0] * (1 - kd) * (a.add[i] ? 0.3 : 1);
      a.vz[i] = a.vz[i] * kd + wind[1] * (1 - kd) * (a.add[i] ? 0.3 : 1);
      a.vy[i] = a.vy[i] * kd - a.grav[i] * dt;
      a.x[i] += a.vx[i] * dt; a.y[i] += a.vy[i] * dt; a.z[i] += a.vz[i] * dt; a.rot[i] += a.rotv[i] * dt;
      if (a.buoy[i] && a.y[i] > water.height(a.x[i], a.z[i]) - 0.01) { this.kill(i); i--; continue; }
      if (a.grav[i] > 0 && !a.under[i] && inBlock(a.x[i], a.z[i]) && a.y[i] < water.ground(a.x[i], a.z[i])) { this.kill(i); i--; continue; }
    }
  }
  // pack into [under-alpha | alpha | additive]; returns counts
  pack(fireLight) {
    const a = this.a, o = this.out, lists = [[], [], []];
    for (let i = 0; i < this.n; i++) lists[a.under[i] ? 0 : a.add[i] ? 2 : 1].push(i);
    let w = 0;
    for (const L of lists) for (const i of L) {
      const t = a.life[i] / a.max[i], s = lerp(a.s0[i], a.s1[i], t);
      const fade = a.nf[i] ? 1 : Math.min(1, a.life[i] * 12) * (1 - smooth(0.6, 1, t));
      let r = lerp(a.r0[i], a.r1[i], t), g = lerp(a.g0[i], a.g1[i], t), bb = lerp(a.b0[i], a.b1[i], t);
      if (a.lit[i]) {   // smoke lit from below by the campfire
        const dx = a.x[i] - fireLight.p[0], dy = a.y[i] - fireLight.p[1], dz = a.z[i] - fireLight.p[2];
        const k = fireLight.i / (1 + (dx * dx + dy * dy + dz * dz) * 6) * 0.5;
        r = r * fireLight.amb[0] + k * 1.0; g = g * fireLight.amb[1] + k * 0.45; bb = bb * fireLight.amb[2] + k * 0.15;
      }
      o.set([a.x[i], a.y[i], a.z[i], s, r, g, bb, lerp(a.a0[i], a.a1[i], t) * fade, a.kind[i], a.rot[i], 0, 0], w * PF); w++;
    }
    return lists.map(l => l.length);
  }
}

// ───────────────────────── rigid bodies ─────────────────────────
const BODY = {
  ball: { r: 0.055, dens: 6.0, drag: 2.2, e: 0.25, fr: 0.25 },
  barrel: { r: 0.085, dens: 0.42, drag: 2.6, e: 0.3, fr: 0.4 },
  coin: { r: 0.04, dens: 3.5, drag: 5.5, e: 0.2, fr: 0.7 },
};
class Body {
  constructor(kind, node) { this.kind = kind; this.node = node; this.alive = false; Object.assign(this, BODY[kind]); }
  spawn(p, v) {
    this.alive = true; this.p = [...p]; this.v = [...v]; this.q = Q.id(); this.w = [0, 0, 0]; this.held = false;
    this.under = false; this.contact = false; this.sub = 0; this.age = 0; this.restT = 0;
    if (this.kind === 'barrel') this.q = Q.axis([0, 0, 1], PI / 2);
    if (this.kind === 'coin') this.w = [rr(-14, 14), rr(-4, 4), rr(-14, 14)];
  }
}

// ───────────────────────── ship (10-point buoyancy rigid body) ─────────────────────────
const SHIP_PROBES = [[0, -0.12, 0.84], [0, -0.12, 0.45], [0.2, -0.1, 0.05], [-0.2, -0.1, 0.05], [0, -0.12, -0.4], [0, -0.1, -0.76]];
class Ship {
  constructor() { this.reset(); }
  reset() {
    const [x, z] = LAYOUT.ship, [ax, az] = LAYOUT.anchor;
    this.yaw0 = Math.atan2(ax - x, az - z);
    this.pos = [x, WL, z]; this.vel = [0, 0, 0]; this.q = Q.axis([0, 1, 0], this.yaw0); this.w = [0, 0, 0];
    this.I = [0.22, 0.24, 0.12]; this.m = 1;
    this.drag = null; this.gunIdx = 0; this.recoil = 0; this.anchored = true; this.control = null;
    this.ropeLen = null;
  }
  toWorld(lp) { return vadd(this.pos, Q.rot(this.q, lp)); }
  toLocal(p) { return Q.rot(Q.conj(this.q), vsub(p, this.pos)); }
  applyImpulse(J, at) {
    this.vel = vmad(this.vel, J, 1 / this.m);
    const r = vsub(at, this.pos), t = vcross(r, J);
    this.w = vadd(this.w, this.invI(t));
  }
  invI(t) { const tl = Q.rot(Q.conj(this.q), t); return Q.rot(this.q, [tl[0] / this.I[0], tl[1] / this.I[1], tl[2] / this.I[2]]); }
  step(dt, water, gl, wind, anchorRing) {
    const F = vscale(gl, this.m); let T = [0, 0, 0];
    const up = vscale(vnorm(gl), -1), gmag = vlen(gl);
    const k = this.m * gmag / (SHIP_INFO.buoy.length * 0.08);
    const force = (f, at) => { F[0] += f[0]; F[1] += f[1]; F[2] += f[2]; T = vadd(T, vcross(vsub(at, this.pos), f)); };
    for (const bp of SHIP_INFO.buoy) {
      const p = this.toWorld(bp), h = water.height(p[0], p[2]), s = clamp(h - p[1], 0, 0.3);
      if (s > 0) {
        const vp = vadd(this.vel, vcross(this.w, vsub(p, this.pos)));
        force(vscale(up, k * s - 0.55 * vdot(vp, up)), p);
        water.pressure(p[0], p[2], 0.13, s * 0.45);
      }
      const g = water.ground(p[0], p[2]) + 0.0;
      if (p[1] - 0.12 < g) force(vscale(up, (g - p[1] + 0.12) * 40), p);
    }
    // shoals & beaches: the keel can't climb out of the water — push back along the slope
    for (const lp of SHIP_PROBES) {
      const p = this.toWorld(lp), g = water.ground(p[0], p[2]), pen = g - (WL - 0.16);
      if (pen <= 0) continue;
      const n = water.groundN(p[0], p[2]); let h = [n[0], 0, n[2]]; const hl = Math.hypot(h[0], h[2]);
      h = hl > 1e-4 ? vscale(h, 1 / hl) : vscale(vnorm([this.pos[0] - p[0], 0, this.pos[2] - p[2]]), 1);
      const vp = vadd(this.vel, vcross(this.w, vsub(p, this.pos))), vn = vdot(vp, h);
      force(vscale(h, pen * 60 - Math.min(vn, 0) * 6), [p[0], this.pos[1], p[2]]);
    }
    for (const [rx, rz, rr2] of this.rocks || []) {   // Skull Rock and sea stacks as round pillars
      if (Math.abs(rx - this.pos[0]) > 2 || Math.abs(rz - this.pos[2]) > 2) continue;
      for (const lp of SHIP_PROBES) {
        const p = this.toWorld(lp), dx = p[0] - rx, dz = p[2] - rz, d = Math.hypot(dx, dz);
        if (d < rr2 && d > 1e-4) { const h = [dx / d, 0, dz / d], vn = vdot(this.vel, h); force(vscale(h, (rr2 - d) * 60 - Math.min(vn, 0) * 6), [p[0], this.pos[1], p[2]]); }
      }
    }
    // waves push the hull downhill
    const sl = water.slope(this.pos[0], this.pos[2]);
    F[0] -= sl[0] * gmag * 0.6; F[2] -= sl[1] * gmag * 0.6;
    // breeze on the sails (center of effort aloft → heel)
    force([wind[0] * 0.32, 0, wind[1] * 0.32], this.toWorld([0, 0.75, 0.05]));
    // anisotropic hull drag (keel resists sideways motion)
    const vb = Q.rot(Q.conj(this.q), this.vel);
    const fb = Q.rot(this.q, [-vb[0] * 2.6, -vb[1] * 0.6, -vb[2] * 1.1]);
    F[0] += fb[0] - this.vel[0] * 0.5; F[1] += fb[1]; F[2] += fb[2] - this.vel[2] * 0.5;
    const wb = Q.rot(Q.conj(this.q), this.w);
    T = vadd(T, Q.rot(this.q, [-wb[0] * 0.25, -wb[1] * 0.35, -wb[2] * 0.2]));
    // helm: thrust along the keel, rudder turns the bow (more bite with way on)
    const C = this.control;
    if (C) {
      const fwd = Q.rot(this.q, [0, 0, 1]), sp = vdot(this.vel, fwd);
      const th = C.thrust > 0 ? C.thrust * C.power : C.thrust * C.reverse;
      F[0] += fwd[0] * th; F[2] += fwd[2] * th;
      const yaw = C.turn * C.rudder * (0.6 + Math.min(Math.abs(sp), 1.2)) * (sp < -0.05 ? -1 : 1);
      T = vadd(T, vscale(up, yaw));
      T = vadd(T, vscale(fwd, -C.turn * Math.min(Math.abs(sp), 1) * 0.015));         // a little heel into the turn
    }
    // ballast: the keel weight rights the hull (keeps her from turning turtle)
    T = vadd(T, vscale(vcross(Q.rot(this.q, [0, 1, 0]), up), 3.5));
    // elastic anchor rode from the bow hawse
    const hw = this.toWorld(SHIP_INFO.anchorHawse), d = vsub(hw, anchorRing), L = vlen(d);
    if (this.ropeLen === null) this.ropeLen = L * 0.985;
    this.rope = L / this.ropeLen;
    if (this.anchored && L > this.ropeLen) {
      const n = vscale(d, 1 / L), vh = vadd(this.vel, vcross(this.w, vsub(hw, this.pos)));
      force(vscale(n, -(L - this.ropeLen) * 6 - Math.max(vdot(vh, n), 0) * 3), hw);
    }
    // player towing
    if (this.drag) {
      const gp = this.toWorld(this.drag.local), dd = vsub(this.drag.target, gp); dd[1] = 0;
      const vg = vadd(this.vel, vcross(this.w, vsub(gp, this.pos)));
      force([dd[0] * 7 - vg[0] * 1.5, 0, dd[2] * 7 - vg[2] * 1.5], [gp[0], this.pos[1], gp[2]]);
    }
    // stay inside the jelly
    if (!INFINITE) for (const c of [0, 2]) {
      const lim = HALF - 0.45, o = this.pos[c];
      if (Math.abs(o) > lim) F[c] -= (o - Math.sign(o) * lim) * 20 + this.vel[c] * 2;
    }
    this.vel = vmad(this.vel, F, dt / this.m);
    this.w = vadd(this.w, vscale(this.invI(T), dt));
    this.pos = vmad(this.pos, this.vel, dt);
    this.q = Q.integ(this.q, this.w, dt);
    this.recoil *= Math.exp(-dt * 6);
  }
}

// chain: catenary-ish quadratic curve from hawse to anchor ring
function chainLinks(a, b, ground, n) {
  const mid = vlerp(a, b, 0.5), dist = vlen(vsub(a, b));
  const sag = Math.max(0.06, 1.25 - dist) * 0.55;
  const c = [mid[0], Math.max(mid[1] - sag, ground(mid[0], mid[2]) + 0.03), mid[2]];
  const out = [];
  const P = t => { const s = 1 - t; return [s * s * a[0] + 2 * s * t * c[0] + t * t * b[0], s * s * a[1] + 2 * s * t * c[1] + t * t * b[1], s * s * a[2] + 2 * s * t * c[2] + t * t * b[2]]; };
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, p = P(t), q = P(Math.min(t + 0.01, 1)), q0 = P(Math.max(t - 0.01, 0));
    let T = vnorm(vsub(q, q0)); const ref = Math.abs(T[1]) < 0.95 ? [0, 1, 0] : [1, 0, 0];

        if (b.sub > 0.05 && b.sub < 0.98 && b.p[1] > h - b.r * 1.5) afloat++;
        else if (b.p[1] + b.r < h - 0.02 && vlen(b.v) < 0.4) sunk++;
      }
      const vig = clamp(Math.sqrt(E / (GN * GN)) * 6 * (VOY() ? 0.5 : 1) + Math.sqrt(kin) * 0.06 + vlen(ship.vel) * 0.8 + Math.hypot(...S.shear) * 4, 0, 1);
      vigSm = lerp(vigSm, vig, 0.35);
      Shell.meter('vigour', vigSm, vigSm < 0.12 ? '平静' : vigSm < 0.35 ? '活跃' : vigSm < 0.65 ? '起伏' : '风暴');
      Shell.count('shots', S.shots); Shell.count('afloat', afloat); Shell.count('sunk', sunk);
      { const sp = vlen([ship.vel[0], 0, ship.vel[2]]); Shell.meter('speed', sp / 1.3, (sp * 8).toFixed(1) + ' 节'); }
      if (INFINITE) Shell.count('distance', Math.round(Math.hypot(ship.pos[0] + ORIGIN[0] - LAYOUT.ship[0], ship.pos[2] + ORIGIN[1] - LAYOUT.ship[1]) * 10));
      const isDark = D.night > CFG().theme.darkAt;
      if (isDark !== dark) { dark = isDark; Shell.setDark(isDark); }
    }
    if (TEST && frame === (+QS.get('frames') || 90)) { document.title = 'READY'; console.log('[pirate-jelly] test frames done; verts', world.V.length / VSTRIDE, 'tris', world.I.length / 3, 'build', info.buildMs.toFixed(0) + 'ms'); }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}
main().catch(e => { console.error(e); fail('果冻凝固时出了点问题：' + e.message); });
